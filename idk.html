
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Babysitters</title>
</head>
<body>
  <h1>Babysitters</h1>

  <ul id="babysitters"></ul>

  <script>
    // In-memory storage
    const babysitters = [
      {
        firstname: "Emma",
        lastname: "Johnson",
        experience: "5 years"
      },
      {
        firstname: "Liam",
        lastname: "Smith",
        experience: "2 years"
      },
      {
        firstname: "Sophie",
        lastname: "Brown",
        experience: "3 years"
      }
    ];

    const list = document.getElementById("babysitters");

    babysitters.forEach(babysitter => {
      const item = document.createElement("li");
      item.textContent =
        `${babysitter.firstname} ${babysitter.lastname} — Experience: ${babysitter.experience}`;
      list.appendChild(item);
    });
  </script>
</body>
</html>
